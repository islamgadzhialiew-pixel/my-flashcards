
    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <title>Мои флеш-карточки 🎓</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

            :root {
                --bg: #131316;
                --card-bg: #26262b;
                --text-primary: #f2f2f4;
                --text-secondary: #9a9aa2;
                --accent-blue: #4d9dff;
                --accent-red: #ff5a52;
                --accent-green: #34d566;
                --divider: #3a3a40;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: var(--bg);
                min-height: 100vh;
                color: var(--text-primary);
            }

            .app {
                max-width: 640px;
                margin: 0 auto;
                padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
                height: 100vh;
                height: 100dvh;   /* карточка занимает весь экран, кнопки всегда внизу */
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-shrink: 0; }

            .icon-btn {
                background: none; border: none; color: var(--text-primary);
                font-size: 24px; width: 40px; height: 40px;
                display: flex; align-items: center; justify-content: center;
                cursor: pointer; border-radius: 50%; flex-shrink: 0; padding: 0;
            }

            .icon-btn:active { background: rgba(255,255,255,0.08); }

            .top-title {
                flex: 1; text-align: center; font-size: 18px; font-weight: 700;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px;
            }

            .icon-spacer { width: 40px; flex-shrink: 0; }

            .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: none; }
            .sidebar-overlay.open { display: block; }

            .sidebar {
                position: fixed; top: 0; left: 0; bottom: 0; width: 300px; max-width: 86vw;
                background: #1c1c20; z-index: 101; transform: translateX(-100%);
                transition: transform 0.25s ease-out; overflow-y: auto;
                box-shadow: 4px 0 24px rgba(0,0,0,0.5);
            }

            .sidebar.open { transform: translateX(0); }

            .sidebar-header {
                padding: 20px 16px; font-size: 16px; font-weight: 700;
                display: flex; justify-content: space-between; align-items: center;
                border-bottom: 1px solid var(--divider); position: sticky; top: 0;
                background: #1c1c20; z-index: 2;
            }

            .sidebar-close {
                background: rgba(255,255,255,0.08); border: none; color: var(--text-primary);
                width: 30px; height: 30px; border-radius: 8px; font-size: 16px; cursor: pointer;
            }

            /* ── Группы (папки) ── */
            .group-header {
                display: flex; align-items: center;
                padding: 0 8px 0 16px;
                background: #202024; border-bottom: 1px solid var(--divider);
                font-weight: 700; font-size: 14px;
            }

            .group-header-clickable {
                display: flex; align-items: center; gap: 8px;
                flex: 1; min-width: 0; padding: 14px 0; cursor: pointer;
            }

            .group-header-clickable:active { opacity: 0.7; }

            .group-rename-btn {
                background: none; border: none; color: var(--text-secondary);
                font-size: 14px; padding: 8px; cursor: pointer; flex-shrink: 0; border-radius: 6px;
            }

            .group-rename-btn:active { background: rgba(255,255,255,0.1); color: var(--text-primary); }

            .group-toggle-icon { color: var(--text-secondary); font-size: 11px; width: 12px; flex-shrink: 0; }

            .group-count { color: var(--text-secondary); font-weight: 400; font-size: 12px; margin-left: auto; }

            .group-decks { display: none; }
            .group-decks.expanded { display: block; }

            .deck-item {
                display: flex; align-items: center; gap: 12px;
                padding: 12px 16px 12px 28px; cursor: pointer;
                border-bottom: 1px solid #232328;
            }

            .deck-item:active, .deck-item.active { background: #232329; }
            .deck-item.active { border-left: 3px solid var(--accent-blue); padding-left: 25px; }

            .deck-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #333; }
            .deck-thumb-placeholder {
                width: 44px; height: 44px; border-radius: 10px; background: #34343c;
                display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
            }

            .deck-info { flex: 1; min-width: 0; }

            .deck-name-row { display: flex; align-items: center; gap: 6px; }

            .deck-name {
                font-size: 13.5px; font-weight: 600; color: var(--text-primary);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
            }

            .deck-rename-btn {
                background: none; border: none; color: var(--text-secondary);
                font-size: 13px; padding: 4px 6px; cursor: pointer; flex-shrink: 0; border-radius: 6px;
            }

            .deck-rename-btn:active { background: rgba(255,255,255,0.1); color: var(--text-primary); }

            .deck-count { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

            .deck-progress-bar {
                display: flex; height: 5px; border-radius: 3px; overflow: hidden;
                background: #38383e; margin-top: 6px;
            }

            .deck-progress-bar .seg.correct { background: var(--accent-green); }
            .deck-progress-bar .seg.incorrect { background: var(--accent-red); }
            .deck-progress-bar .seg.remaining { background: transparent; }

            /* ── Карточка ──
               Сверху всегда текст на изучаемом языке.
               Карточка разделена тонкой линией на две зоны:
                 верхняя — тап сразу показывает картинку и перевод,
                 нижняя — по шагам: 1-й тап картинка, 2-й тап перевод.
               Свайп вправо — «знаю», влево — «не знаю». */
            .card {
                background: var(--card-bg); border-radius: 28px; padding: 14px 18px 0;
                flex: 1; min-height: 0; display: flex; flex-direction: column;
                position: relative; overflow: hidden;
                touch-action: pan-y; user-select: none; -webkit-user-select: none;
                will-change: transform;
            }

            .card.enter { animation: fadeIn 0.3s ease-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }

            .card-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
            .card-counter { font-size: 14px; color: var(--text-secondary); font-weight: 500; }

            .mini-btn {
                background: rgba(154,154,162,0.12); border: none; color: var(--text-secondary);
                width: 34px; height: 34px; border-radius: 50%; font-size: 16px; cursor: pointer;
                display: flex; align-items: center; justify-content: center;
            }
            .mini-btn:active { background: rgba(154,154,162,0.3); }
            .mini-btn.disabled { opacity: 0.3; pointer-events: none; }

            .zone { display: flex; flex-direction: column; min-height: 0; cursor: pointer; }
            .zone-top { flex: 1.35 1 0; padding: 6px 0 12px; }
            .zone-bottom { flex: 1 1 0; padding: 14px 0 16px; overflow-y: auto; }

            .zone-divider { height: 1px; background: var(--divider); margin: 0 -18px; flex-shrink: 0; }

            .question-text {
                font-size: 26px; font-weight: 600; line-height: 1.3; color: var(--text-primary);
                text-align: center; padding: 6px 0; flex-shrink: 0;
            }
            .question-text[dir="rtl"] { font-size: 32px; line-height: 1.6; }
            .question-text.cjk { font-size: 34px; letter-spacing: 1px; }

            .image-slot { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: 8px; }
            .image-slot img {
                max-width: 100%; max-height: 100%; border-radius: 16px; object-fit: contain;
                animation: fadeIn 0.25s ease-out;
            }

            .zone-hint { color: #66666e; font-size: 14px; text-align: center; margin: auto; padding: 10px; }

            .answer-text {
                font-size: 21px; line-height: 1.4; color: var(--text-primary); text-align: center;
                margin: auto 0; animation: fadeIn 0.25s ease-out;
            }

            /* Подсветка при свайпе */
            .swipe-badge {
                position: absolute; top: 18px; padding: 6px 14px; border-radius: 10px;
                font-size: 18px; font-weight: 800; letter-spacing: 1px; opacity: 0;
                pointer-events: none; border: 3px solid;
            }
            .swipe-badge.know { left: 18px; color: var(--accent-green); border-color: var(--accent-green); transform: rotate(-12deg); }
            .swipe-badge.dont { right: 18px; color: var(--accent-red); border-color: var(--accent-red); transform: rotate(12deg); }

            /* ── Нижняя панель: ✕  🔊  ✓ (под большим пальцем) ── */
            .nav-row { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 14px; }

            .act {
                background: #1c1c20; border: 1.5px solid var(--divider); cursor: pointer;
                height: 64px; border-radius: 32px; flex: 1; max-width: 140px;
                display: flex; align-items: center; justify-content: center; gap: 8px;
                font-size: 22px; font-weight: 700;
            }
            .act:active { background: #29292f; }
            .act small { font-size: 15px; font-weight: 600; opacity: 0.8; }
            .act-wrong { color: var(--accent-red); }
            .act-right { color: var(--accent-green); }

            .act-speak {
                flex: 0 0 72px; height: 72px; border-radius: 50%;
                background: rgba(77,157,255,0.15); border-color: rgba(77,157,255,0.35);
                color: var(--accent-blue); font-size: 28px;
            }
            .act-speak:active, .act-speak.speaking { background: rgba(77,157,255,0.4); }

            .progress-bar { width: 100%; height: 3px; background: #2a2a30; border-radius: 2px; margin-top: 14px; flex-shrink: 0; }
            .progress-fill { height: 100%; background: var(--accent-blue); border-radius: 2px; transition: width 0.3s ease; }

            .keyboard-hint { text-align: center; color: #55555c; font-size: 11px; margin-top: 10px; }

            .results-title { text-align: center; font-size: 20px; color: var(--text-primary); margin-bottom: 22px; font-weight: 700; }
            .results-summary { display: flex; justify-content: center; gap: 34px; margin-bottom: 28px; }
            .results-stat { text-align: center; }
            .results-stat-number { font-size: 34px; font-weight: 700; }
            .results-stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
            .results-stat.correct .results-stat-number { color: var(--accent-green); }
            .results-stat.incorrect .results-stat-number { color: var(--accent-red); }

            .chart-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
            .chart-bar-label { width: 80px; font-size: 13px; color: var(--text-secondary); text-align: right; flex-shrink: 0; }
            .chart-bar-track { flex: 1; background: #2a2a30; border-radius: 10px; height: 24px; overflow: hidden; }
            .chart-bar-fill {
                height: 100%; border-radius: 10px; display: flex; align-items: center;
                justify-content: flex-end; padding-right: 10px; color: #0c0c0e;
                font-size: 12px; font-weight: 700; transition: width 0.6s ease; min-width: 28px;
            }
            .chart-bar-fill.correct { background: var(--accent-green); }
            .chart-bar-fill.incorrect { background: var(--accent-red); }

            .results-wrap { padding: 10px 0 18px; overflow-y: auto; }
            .results-list { margin-top: 18px; max-height: 220px; overflow-y: auto; border-top: 1px solid var(--divider); padding-top: 10px; }
            .results-list-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; color: var(--text-secondary); border-bottom: 1px solid #2a2a30; }

            .reset-btn {
                display: block; margin: 20px auto 0; background: var(--accent-blue); color: #0c0c0e;
                border: none; padding: 12px 28px; border-radius: 24px; font-size: 15px; font-weight: 700; cursor: pointer;
            }

            .empty-state { text-align: center; color: var(--text-secondary); padding: 60px 20px; font-size: 15px; }

            @media (max-width: 420px) {
                .card { padding: 12px 14px 0; }
                .zone-divider { margin: 0 -14px; }
                .question-text { font-size: 22px; }
                .question-text[dir="rtl"] { font-size: 28px; }
                .question-text.cjk { font-size: 30px; }
                .answer-text { font-size: 18px; }
                .nav-row { gap: 12px; }
                .act { height: 58px; }
                .act-speak { flex-basis: 66px; height: 66px; }
                .keyboard-hint { display: none !important; }
            }
        </style>
    </head>
    <body>
        <script src="data/Тест.js"></script>

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>📚 Мои колоды</span>
                <button class="sidebar-close" onclick="closeSidebar()">✕</button>
            </div>
            <div id="deckList"></div>
        </div>

        <div class="app">
            <div class="top-bar">
                <button class="icon-btn" onclick="openSidebar()">☰</button>
                <div class="top-title" id="deckTitleBar"></div>
                <div class="icon-spacer"></div>
            </div>

            <div class="card" id="flashcard"></div>
            <div class="nav-row" id="navRow"></div>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
            <div class="keyboard-hint" id="hint">⌨️ ↑ всё сразу · ↓ или SPACE по шагам · Y/N оценка · ←/→ листать · S озвучить</div>
        </div>

        <script>
            const ALL_DECKS = window.ALL_DECKS || {};
            const groupNames = Object.keys(ALL_DECKS);

            let currentGroupName = null;
            let currentDeckName = null;
            let currentCard = 0;
            let imageShown = false;    // открыта ли картинка (верхняя зона)
            let answerShown = false;   // открыт ли перевод (нижняя зона)
            let onResultsScreen = false;
            let deckResults = {};
            let expandedGroups = new Set();

            function deckKey(group, deck) { return group + '::' + deck; }

            function getResults() {
                return deckResults[deckKey(currentGroupName, currentDeckName)];
            }

            function isRTL(text) {
                const rtlChars = /[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFC]/;
                return rtlChars.test(text);
            }

            // ── Озвучка текста (встроенный синтез речи браузера, бесплатно, офлайн) ──
            function detectSpeechLang(text) {
                if (/[\u0600-\u06FF]/.test(text)) return 'ar-SA';   // арабский
                if (/[\u0400-\u04FF]/.test(text)) return 'ru-RU';   // русский
                if (/[\u4e00-\u9fff]/.test(text)) return 'zh-CN';   // китайский
                if (/[\u3040-\u30ff]/.test(text)) return 'ja-JP';   // японский
                if (/[\u0E00-\u0E7F]/.test(text)) return 'th-TH';   // тайский
                return 'en-US';                                        // латиница по умолчанию
            }

            function speakText(text) {
                if (!('speechSynthesis' in window)) {
                    alert('Озвучка не поддерживается в этом браузере');
                    return;
                }
                window.speechSynthesis.cancel(); // прерываем предыдущую озвучку, если была
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = detectSpeechLang(text);
                utterance.rate = 0.9; // чуть медленнее обычного — удобнее для изучения языка

                const btn = document.getElementById('speakBtn');
                if (btn) {
                    utterance.onstart = () => btn.classList.add('speaking');
                    utterance.onend = () => btn.classList.remove('speaking');
                    utterance.onerror = () => btn.classList.remove('speaking');
                }

                window.speechSynthesis.speak(utterance);
            }

            function speakCurrentCard() {
                const card = currentDeck()[currentCard];
                speakText(card.question);
            }

            function currentDeck() {
                return ALL_DECKS[currentGroupName][currentDeckName];
            }

            const DECK_NAMES_STORAGE_KEY = 'flashcard_deck_display_names_v2';

            function loadDeckDisplayNames() {
                try {
                    const raw = localStorage.getItem(DECK_NAMES_STORAGE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) { return {}; }
            }

            function saveDeckDisplayNames(obj) {
                try { localStorage.setItem(DECK_NAMES_STORAGE_KEY, JSON.stringify(obj)); } catch (e) {}
            }

            let deckDisplayNames = loadDeckDisplayNames();

            function getDisplayName(key) { return deckDisplayNames[key] || key.split('::')[1]; }

            function startRenameDeck(group, deck) {
                const key = deckKey(group, deck);
                const current = getDisplayName(key);
                const newName = prompt('Новое название колоды:', current);
                if (newName && newName.trim() && newName.trim() !== current) {
                    deckDisplayNames[key] = newName.trim();
                    saveDeckDisplayNames(deckDisplayNames);
                    renderSidebar();
                    if (currentGroupName === group && currentDeckName === deck) renderCard();
                }
            }

            function toggleGroup(group) {
                if (expandedGroups.has(group)) expandedGroups.delete(group);
                else expandedGroups.add(group);
                renderSidebar();
            }

            // ── Переименование ГРУПП (папок/разделов, например "Общее") ──
            const GROUP_NAMES_STORAGE_KEY = 'flashcard_group_display_names_v1';

            function loadGroupDisplayNames() {
                try {
                    const raw = localStorage.getItem(GROUP_NAMES_STORAGE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) { return {}; }
            }

            function saveGroupDisplayNames(obj) {
                try { localStorage.setItem(GROUP_NAMES_STORAGE_KEY, JSON.stringify(obj)); } catch (e) {}
            }

            let groupDisplayNames = loadGroupDisplayNames();

            function getGroupDisplayName(originalName) {
                return groupDisplayNames[originalName] || originalName;
            }

            function startRenameGroup(originalName) {
                const current = getGroupDisplayName(originalName);
                const newName = prompt('Новое название раздела:', current);
                if (newName && newName.trim() && newName.trim() !== current) {
                    groupDisplayNames[originalName] = newName.trim();
                    saveGroupDisplayNames(groupDisplayNames);
                    renderSidebar();
                    if (currentGroupName === originalName) renderCard();
                }
            }

            function renderSidebar() {
                const listEl = document.getElementById('deckList');

                if (groupNames.length === 0) {
                    listEl.innerHTML = '<div class="empty-state">Колоды не найдены</div>';
                    return;
                }

                listEl.innerHTML = groupNames.map(group => {
                    const decks = ALL_DECKS[group];
                    const deckNamesInGroup = Object.keys(decks);
                    const isExpanded = expandedGroups.has(group);

                    const decksHtml = deckNamesInGroup.map(deck => {
                        const cards = decks[deck];
                        const key = deckKey(group, deck);
                        const firstImg = cards.find(c => c.image);
                        const thumb = firstImg
                            ? `<img class="deck-thumb" src="${firstImg.image}" alt="">`
                            : `<div class="deck-thumb-placeholder">📖</div>`;
                        const activeClass = (group === currentGroupName && deck === currentDeckName) ? 'active' : '';

                        const arr = deckResults[key] || new Array(cards.length).fill(null);
                        const total = cards.length;
                        const correct = arr.filter(r => r === true).length;
                        const incorrect = arr.filter(r => r === false).length;
                        const answered = correct + incorrect;
                        const remaining = total - answered;

                        let progressText;
                        if (answered === 0) progressText = `${total} карточек`;
                        else if (answered === total) progressText = `✅ Пройдено: ${correct}/${total}`;
                        else progressText = `${answered}/${total} пройдено`;

                        const displayName = getDisplayName(key);
                        const safeGroup = group.replace(/'/g, "\\'");
                        const safeDeck = deck.replace(/'/g, "\\'");

                        return `
                            <div class="deck-item ${activeClass}" onclick="selectDeck('${safeGroup}', '${safeDeck}')">
                                ${thumb}
                                <div class="deck-info">
                                    <div class="deck-name-row">
                                        <div class="deck-name">${displayName}</div>
                                        <button class="deck-rename-btn" onclick="event.stopPropagation(); startRenameDeck('${safeGroup}', '${safeDeck}')">✎</button>
                                    </div>
                                    <div class="deck-count">${progressText}</div>
                                    <div class="deck-progress-bar">
                                        <div class="seg correct" style="flex:${correct} ${correct} 0"></div>
                                        <div class="seg incorrect" style="flex:${incorrect} ${incorrect} 0"></div>
                                        <div class="seg remaining" style="flex:${remaining} ${remaining} 0"></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                    const safeGroupId = group.replace(/[^a-zA-Z0-9]/g, '_');
                    const safeGroupForJs = group.replace(/'/g, "\\'");
                    const groupDisplayName = getGroupDisplayName(group);

                    return `
                        <div class="group-section">
                            <div class="group-header">
                                <div class="group-header-clickable" onclick="toggleGroup('${safeGroupForJs}')">
                                    <span class="group-toggle-icon">${isExpanded ? '▾' : '▸'}</span>
                                    <span>📁 ${groupDisplayName}</span>
                                    <span class="group-count">${deckNamesInGroup.length} колод</span>
                                </div>
                                <button class="group-rename-btn" onclick="event.stopPropagation(); startRenameGroup('${safeGroupForJs}')">✎</button>
                            </div>
                            <div class="group-decks ${isExpanded ? 'expanded' : ''}" id="group-${safeGroupId}">
                                ${decksHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            function openSidebar() {
                document.getElementById('sidebar').classList.add('open');
                document.getElementById('sidebarOverlay').classList.add('open');
            }

            function closeSidebar() {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            }

            function selectDeck(group, deck) {
                closeSidebar();

                currentGroupName = group;
                currentDeckName = deck;
                expandedGroups.add(group);

                const key = deckKey(group, deck);
                if (!deckResults[key]) {
                    deckResults[key] = new Array(ALL_DECKS[group][deck].length).fill(null);
                }

                const arr = deckResults[key];
                const firstUnanswered = arr.findIndex(r => r === null);
                renderSidebar();

                if (firstUnanswered === -1 && arr.length > 0) {
                    currentCard = arr.length - 1;
                    showResults();
                } else {
                    currentCard = firstUnanswered === -1 ? 0 : firstUnanswered;
                    showCard();
                }
            }

            function isCJK(text) { return /[\u4e00-\u9fff\u3040-\u30ff\uac00-\ud7af]/.test(text); }

            // Открыть новую карточку: всё скрыто, виден только текст
            function showCard() {
                imageShown = false;
                answerShown = false;
                onResultsScreen = false;
                const hint = document.getElementById('hint');
                hint.style.display = '';
                renderCard(true);
            }

            function renderCard(animate) {
                const deck = currentDeck();
                const card = deck[currentCard];
                const cardEl = document.getElementById('flashcard');

                document.getElementById('deckTitleBar').textContent = getGroupDisplayName(currentGroupName) + ' · ' + getDisplayName(deckKey(currentGroupName, currentDeckName));

                const textDirection = isRTL(card.question) ? 'rtl' : 'ltr';
                const cjkClass = isCJK(card.question) ? 'cjk' : '';

                let topContent;
                if (!card.image) topContent = '';
                else if (imageShown) topContent = `<div class="image-slot"><img src="${card.image}" alt=""></div>`;
                else topContent = `<div class="zone-hint">👆 сюда — сразу картинка и перевод</div>`;

                let bottomHint = '👇 сюда — сначала картинка, потом перевод';
                if (!card.image) bottomHint = '👇 сюда — перевод';
                else if (imageShown) bottomHint = '👇 ещё раз — перевод';
                const bottomContent = answerShown
                    ? `<div class="answer-text">${card.answer}</div>`
                    : `<div class="zone-hint">${bottomHint}</div>`;

                cardEl.style.transition = '';
                cardEl.style.transform = '';
                cardEl.innerHTML = `
                    <div class="card-top-row">
                        <button class="mini-btn ${currentCard === 0 ? 'disabled' : ''}" onclick="previousCard()" title="Предыдущая">‹</button>
                        <span class="card-counter">${currentCard + 1} из ${deck.length}</span>
                        <button class="mini-btn" onclick="goNext()" title="Пропустить без оценки">›</button>
                    </div>
                    <div class="zone zone-top" id="zoneTop">
                        <p class="question-text ${cjkClass}" dir="${textDirection}">${card.question}</p>
                        ${topContent}
                    </div>
                    <div class="zone-divider"></div>
                    <div class="zone zone-bottom" id="zoneBottom">${bottomContent}</div>
                    <div class="swipe-badge know" id="badgeKnow">ЗНАЮ</div>
                    <div class="swipe-badge dont" id="badgeDont">НЕ ЗНАЮ</div>
                `;

                if (animate) {
                    cardEl.classList.remove('enter');
                    void cardEl.offsetWidth;   // перезапуск анимации появления
                    cardEl.classList.add('enter');
                }

                document.getElementById('progress').style.width = (((currentCard + 1) / deck.length) * 100) + '%';
                renderNavRow();
            }

            function renderNavRow() {
                const arr = getResults();
                const correct = arr.filter(r => r === true).length;
                const incorrect = arr.filter(r => r === false).length;

                document.getElementById('navRow').innerHTML = `
                    <button class="act act-wrong" onclick="rate(false)">✕ <small>${incorrect}</small></button>
                    <button class="act act-speak" id="speakBtn" onclick="speakCurrentCard()">🔊</button>
                    <button class="act act-right" onclick="rate(true)">✓ <small>${correct}</small></button>
                `;
            }

            // Верхняя зона: сразу всё — картинка и перевод (повторный тап скрывает)
            function tapTop() {
                const card = currentDeck()[currentCard];
                const allShown = answerShown && (imageShown || !card.image);
                imageShown = !allShown && !!card.image;
                answerShown = !allShown;
                renderCard(false);
            }

            // Нижняя зона: по шагам — текст → картинка → перевод
            function tapBottom() { revealNextStep(); }

            // Тоже по шагам (нижняя зона и SPACE)
            function revealNextStep() {
                const card = currentDeck()[currentCard];
                if (card.image && !imageShown) imageShown = true;
                else if (!answerShown) answerShown = true;
                else { imageShown = false; answerShown = false; }
                renderCard(false);
            }

            let ratingInProgress = false;

            function rate(knewIt) {
                if (onResultsScreen || ratingInProgress) return;
                getResults()[currentCard] = knewIt;
                if (navigator.vibrate) navigator.vibrate(12);
                renderSidebar();
                goNext();
            }

            function goNext() {
                const deck = currentDeck();
                if (currentCard < deck.length - 1) {
                    currentCard++;
                    showCard();
                } else {
                    showResults();
                }
            }

            function previousCard() {
                if (currentCard > 0) {
                    currentCard--;
                    showCard();
                }
            }

            // ── Свайпы и тапы по карточке ──
            // Свайп вправо — «знаю» (✓), влево — «не знаю» (✕).
            // Короткое касание без сдвига — тап по зоне (картинка/перевод).
            const SWIPE_THRESHOLD = 90;   // px, сколько протащить для оценки
            let drag = null;

            function setBadges(dx) {
                const k = document.getElementById('badgeKnow');
                const d = document.getElementById('badgeDont');
                if (k) k.style.opacity = Math.max(0, Math.min(1, dx / SWIPE_THRESHOLD));
                if (d) d.style.opacity = Math.max(0, Math.min(1, -dx / SWIPE_THRESHOLD));
            }

            function setupGestures() {
                const cardEl = document.getElementById('flashcard');

                cardEl.addEventListener('pointerdown', (e) => {
                    if (onResultsScreen || ratingInProgress) return;
                    if (e.target.closest('button')) return;
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    drag = { x: e.clientX, y: e.clientY, t: Date.now(), dx: 0, moving: false, id: e.pointerId, target: e.target };
                });

                cardEl.addEventListener('pointermove', (e) => {
                    if (!drag || e.pointerId !== drag.id) return;
                    const dx = e.clientX - drag.x;
                    const dy = e.clientY - drag.y;
                    if (!drag.moving) {
                        if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
                            drag.moving = true;
                            try { cardEl.setPointerCapture(e.pointerId); } catch (err) {}
                        } else if (Math.abs(dy) > 10) {
                            drag = null;   // вертикальное движение — прокрутка, не свайп
                            return;
                        } else return;
                    }
                    drag.dx = dx;
                    cardEl.style.transition = 'none';
                    cardEl.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
                    setBadges(dx);
                });

                const finish = (e, cancelled) => {
                    if (!drag || e.pointerId !== drag.id) return;
                    const d = drag;
                    drag = null;

                    if (!d.moving) {
                        if (cancelled) return;
                        // Тап: какая зона?
                        if (d.target.closest('#zoneBottom')) tapBottom();
                        else tapTop();
                        return;
                    }

                    const velocity = Math.abs(d.dx) / Math.max(1, Date.now() - d.t);
                    const passed = !cancelled && (Math.abs(d.dx) > SWIPE_THRESHOLD || (Math.abs(d.dx) > 40 && velocity > 0.6));

                    if (passed) {
                        const knewIt = d.dx > 0;
                        ratingInProgress = true;
                        cardEl.style.transition = 'transform 0.22s ease-in';
                        cardEl.style.transform = `translateX(${knewIt ? 130 : -130}vw) rotate(${knewIt ? 18 : -18}deg)`;
                        setTimeout(() => {
                            ratingInProgress = false;
                            rate(knewIt);
                        }, 200);
                    } else {
                        cardEl.style.transition = 'transform 0.2s ease-out';
                        cardEl.style.transform = '';
                        setBadges(0);
                    }
                };

                cardEl.addEventListener('pointerup', (e) => finish(e, false));
                cardEl.addEventListener('pointercancel', (e) => finish(e, true));
            }

            function showResults() {
                const deck = currentDeck();
                const arr = getResults();
                onResultsScreen = true;

                const correct = arr.filter(r => r === true).length;
                const incorrect = arr.filter(r => r === false).length;
                const total = deck.length;
                const correctPct = total > 0 ? Math.round((correct / total) * 100) : 0;
                const incorrectPct = total > 0 ? Math.round((incorrect / total) * 100) : 0;

                const listHtml = deck.map((card, idx) => {
                    const icon = arr[idx] === true ? '✅' : (arr[idx] === false ? '❌' : '⏭️');
                    return `<div class="results-list-item">${icon} <span>${card.question}</span></div>`;
                }).join('');

                const cardEl = document.getElementById('flashcard');
                cardEl.style.transition = '';
                cardEl.style.transform = '';
                cardEl.innerHTML = `
                    <div class="results-wrap">
                        <div class="results-title">🎉 Колода «${getDisplayName(deckKey(currentGroupName, currentDeckName))}» пройдена!</div>
                        <div class="results-summary">
                            <div class="results-stat correct"><div class="results-stat-number">${correct}</div><div class="results-stat-label">✓ Знал</div></div>
                            <div class="results-stat incorrect"><div class="results-stat-number">${incorrect}</div><div class="results-stat-label">✕ Не знал</div></div>
                        </div>
                        <div class="chart-bar-row">
                            <div class="chart-bar-label">Знал</div>
                            <div class="chart-bar-track"><div class="chart-bar-fill correct" style="width: ${Math.max(correctPct, correct > 0 ? 8 : 0)}%">${correct > 0 ? correctPct + '%' : ''}</div></div>
                        </div>
                        <div class="chart-bar-row">
                            <div class="chart-bar-label">Не знал</div>
                            <div class="chart-bar-track"><div class="chart-bar-fill incorrect" style="width: ${Math.max(incorrectPct, incorrect > 0 ? 8 : 0)}%">${incorrect > 0 ? incorrectPct + '%' : ''}</div></div>
                        </div>
                        <div class="results-list">${listHtml}</div>
                        <button class="reset-btn" onclick="resetDeck()">🔄 Пройти заново</button>
                    </div>
                `;

                document.getElementById('navRow').innerHTML = '';
                document.getElementById('progress').style.width = '100%';
                document.getElementById('hint').style.display = 'none';
            }

            function resetDeck() {
                currentCard = 0;
                deckResults[deckKey(currentGroupName, currentDeckName)] = new Array(currentDeck().length).fill(null);
                renderSidebar();
                showCard();
            }

            document.addEventListener('keydown', (e) => {
                if (onResultsScreen || !currentDeckName) return;
                if (e.key === ' ') { e.preventDefault(); revealNextStep(); }
                if (e.key === 'ArrowUp') { e.preventDefault(); tapTop(); }
                if (e.key === 'ArrowDown') { e.preventDefault(); tapBottom(); }
                if (e.key === 'ArrowRight') goNext();
                if (e.key === 'ArrowLeft') previousCard();
                if (e.key === 'y' || e.key === 'Y') rate(true);
                if (e.key === 'n' || e.key === 'N') rate(false);
                if (e.key === 's' || e.key === 'S' || e.key === 'Escape') { e.preventDefault(); speakCurrentCard(); }
            });

            // ── Инициализация ──
            groupNames.forEach(group => {
                Object.keys(ALL_DECKS[group]).forEach(deck => {
                    deckResults[deckKey(group, deck)] = new Array(ALL_DECKS[group][deck].length).fill(null);
                });
            });

            setupGestures();

            if (groupNames.length > 0) {
                currentGroupName = groupNames[0];
                currentDeckName = Object.keys(ALL_DECKS[currentGroupName])[0];
                expandedGroups.add(currentGroupName);
                renderSidebar();
                showCard();
            } else {
                onResultsScreen = true;
                document.getElementById('flashcard').innerHTML = '<div class="empty-state">Колоды не найдены.<br>Добавьте CSV файлы в decks/ и запустите ноутбук заново.</div>';
                document.getElementById('hint').style.display = 'none';
            }
        </script>
    </body>
    </html>
